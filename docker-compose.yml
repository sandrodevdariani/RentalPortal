# Official SQL Server 2022. linux/amd64 runs on Windows, Linux, and Apple Silicon
# (Docker Desktop + Rosetta). There is no native SQL Server installer for macOS.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: rentalportal-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RentalPortal!123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - rentalportal-sql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "RentalPortal!123" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 25s

volumes:
  rentalportal-sql:
